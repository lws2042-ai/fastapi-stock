name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:  # Actions 탭에서 수동 배포

# 배포가 겹치지 않게 한 번에 하나씩
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Python 문법 검사
        run: python3 -m py_compile *.py

      - name: SSH 준비
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: EC2에 배포
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 "${EC2_USER:-ubuntu}@$EC2_HOST" \
            "BRANCH=${GITHUB_REF_NAME} bash -s" < deploy/deploy.sh

      - name: 외부 접속 확인
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://$EC2_HOST/") || true
            echo "HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 3
          done
          exit 1
