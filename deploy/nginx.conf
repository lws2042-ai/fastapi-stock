# HTTP 전용 설정. HTTPS 인증서가 아직 없을 때(첫 배포, 발급 실패) 쓰인다.
# 인증서가 생기면 deploy.sh 가 nginx-https.conf 로 바꿔 끼운다.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Let's Encrypt 인증서 발급/갱신 확인용
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include snippets/fastapi-stock-app.conf;
}
