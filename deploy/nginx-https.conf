# HTTPS 설정. Let's Encrypt IP 주소 인증서(/etc/letsencrypt/live/fastapi-stock)가 있을 때 deploy.sh 가 설치한다.
# 인증서 유효기간은 6일이며 snap certbot 타이머가 자동 갱신하고, 갱신되면 nginx 를 reload 한다.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 인증서 갱신 확인은 HTTP 로 받아야 한다
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/fastapi-stock/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fastapi-stock/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include snippets/fastapi-stock-app.conf;
}
