# HTTP/HTTPS server 블록이 함께 쓰는 앱 설정 (/etc/nginx/snippets/fastapi-stock-app.conf 로 설치)

# React 빌드 결과 (fastapi-stock-react 의 dist). 없으면 FastAPI 기본 화면으로 대체.
root /var/www/fastapi-stock-react;
index index.html;

# 주문/계좌 API는 외부에 절대 노출하지 않는다 (로그인 인증을 붙이기 전까지).
# 서버의 ENABLE_TRADING_API=false 와 이중으로 막는다.
location ^~ /api/trading {
    return 403;
}
location ^~ /trading {
    return 403;
}

# REST + 실시간 WebSocket → FastAPI   (/api/stocks/... → /stocks/..., /api/ws/... → /ws/...)
location /api/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;  # WebSocket 유지 + 60분봉 첫 조회(10초 이상) 대비
}

# 빌드 파일은 이름에 해시가 붙으므로 오래 캐시
location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
}

location / {
    try_files $uri /index.html @fastapi;
}

location @fastapi {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
